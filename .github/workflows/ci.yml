name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # constraints.txt（deps-lock.yml が作る）があれば、版を固定して入れる
      - run: if [ -f constraints.txt ]; then pip install -e ".[dev]" -c constraints.txt; else pip install -e ".[dev]"; fi
      - run: ruff check . && ruff format --check .
      - name: type check (mypy)
        run: mypy
      # moto（DynamoDB の模擬）と slack_bolt のテストも実行される. カバレッジが下限（pyproject.toml の fail_under）を下回ると落ちる
      - run: pytest -q -rs --cov

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: if [ -f constraints.txt ]; then pip install -e ".[dev]" -c constraints.txt; else pip install -e ".[dev]"; fi
      - run: pytest -q -rs

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: if [ -f constraints.txt ]; then pip install -e . -c constraints.txt; else pip install -e .; fi
      - run: pip install "bandit==1.8.6" "pip-audit==2.9.0"
      - name: SAST (bandit)
        run: bandit -q -r src -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable --progress-spinner off

  dynamodb-local:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: if [ -f constraints.txt ]; then pip install -e . -c constraints.txt; else pip install -e .; fi
      - name: create tables on DynamoDB Local (twice, idempotent)
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
        run: |
          python scripts/create_tables.py --endpoint http://localhost:8000
          python scripts/create_tables.py --endpoint http://localhost:8000
      - name: round trip
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
        run: |
          python - <<'PY'
          from datetime import date
          from agenda_bot import service
          from agenda_bot.repository import DynamoRepository
          repo = DynamoRepository(endpoint_url="http://localhost:8000")
          assert repo.check_tables() == [], repo.check_tables()  # 起動時の確認（テーブル・GSI）
          m = service.register_meeting(repo, "C1", "UO", "定例", 0, "10:00", 30)
          assert [x.meeting_id for x in repo.meetings_in_channel("C1")] == [m.meeting_id]  # GSI の Query
          service.add_draft(repo, m, date(2026, 10, 2), "議題", "", 10, "", "UA")  # TransactWriteItems
          # 会議の版が違えば議題を書かない（会議の変更との競合を防ぐ条件付きの書き込み）
          from agenda_bot.model import DraftItem
          assert repo.put_draft_if_schedule(DraftItem(m.meeting_id, "2026-10-05", "x", "t", "", 5, "UA", "UA"), 99) is False
          v = service.agenda(repo, m, date(2026, 10, 2))
          assert [r["title"] for r in v.rows] == ["議題"], v.rows
          # 条件付き put（Canvas の重複防止）と繰り越しのクエリも DynamoDB Local で確かめる
          from agenda_bot.model import CanvasRecord
          assert repo.put_canvas_if(CanvasRecord(m.meeting_id, "2026-10-05", ""), None) is True
          assert repo.put_canvas_if(CanvasRecord(m.meeting_id, "2026-10-05", ""), None) is False
          service.add_draft(repo, m, date(2026, 10, 2), "長い議題", "", 30, "", "UB")
          v = service.agenda(repo, m, date(2026, 10, 6))
          assert [(r["kind"], r["title"]) for r in v.rows] == [("繰越", "長い議題")], v.rows
          # 見るだけでは状態を変えず、担当者の「確定」で書き換える
          assert {d.status for d in repo.drafts(m.meeting_id, "2026-10-05")} == {"proposed"}
          service.finalize(repo, m, "2026-10-05", date(2026, 10, 6))
          assert [(d.title, d.status) for d in repo.drafts(m.meeting_id, "2026-10-05")] == [("議題", "accepted")]
          assert [(d.title, d.status) for d in repo.drafts(m.meeting_id, "2026-10-12")] == [("長い議題", "deferred")]
          # 確定した開催日を記録し（次から読まない）、扱い済みの議題には TTL 属性が入る
          assert repo.get_meeting(m.meeting_id).settled_through == "2026-10-05"
          assert repo.drafts(m.meeting_id, "2026-10-05")[0].expires_at > 0
          ttl = repo.db.meta.client.describe_time_to_live(TableName="agenda_drafts")["TimeToLiveDescription"]
          assert ttl.get("AttributeName") == "expires_at", ttl
          print(v.markdown)
          PY
