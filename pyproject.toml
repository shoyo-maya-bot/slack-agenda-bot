[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-agenda-bot"
version = "0.1.0"
description = "定例会議のアジェンダを Slack（/agenda）で集め、固定の議題と合わせて Canvas にまとめるボット（Bolt・Socket Mode・DynamoDB）"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["slack_bolt>=1.18", "boto3>=1.34", "tzdata; sys_platform == 'win32'"]  # Windows はタイムゾーンのデータを持たないため tzdata

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "moto[dynamodb]>=5.0"]

[project.scripts]
agenda-bot = "agenda_bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.pycodestyle]
max-line-length = 190

[tool.pytest.ini_options]
testpaths = ["tests"]
