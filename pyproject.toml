[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-agenda-bot"
version = "0.1.0"
description = "定例会議のアジェンダを Slack（/agenda）で集め、固定の議題と合わせて Canvas にまとめるボット（Bolt・Socket Mode・DynamoDB）"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["slack_bolt>=1.18", "boto3>=1.34", "tzdata; sys_platform == 'win32'"]  # Windows はタイムゾーンのデータを持たないため tzdata

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "moto[dynamodb]>=5.0", "mypy>=1.11"]

[project.scripts]
agenda-bot = "agenda_bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.pycodestyle]
max-line-length = 190

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# boto3 / botocore は型情報（py.typed）を持たない
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agenda_bot"]

[tool.coverage.report]
# CI（pytest --cov）でこれを下回ると落とす. 今は約 93%
fail_under = 90
show_missing = true
skip_covered = true
